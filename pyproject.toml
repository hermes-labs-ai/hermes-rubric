[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-rubric"
version = "1.0.0"
description = "Evidence-first structured scoring. Class-aware rubric templates for deterministic dim sets across runs."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rolando Bosch", email = "rbosch@lpci.ai" }]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]
keywords = ["llm", "evaluation", "rubric", "scoring", "ai-audit", "evidence", "hermes-labs"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]
# SDK-based backends are optional; users install the provider they want.
openai = ["openai>=1.50"]
google = ["google-generativeai>=0.8"]

[project.scripts]
hermes-rubric = "hermes_rubric.cli:main"

[project.urls]
Homepage = "https://hermes-labs.ai"
Repository = "https://github.com/hermes-labs-ai/hermes-rubric"
Issues = "https://github.com/hermes-labs-ai/hermes-rubric/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_rubric"]
include = ["src/hermes_rubric/classes/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
