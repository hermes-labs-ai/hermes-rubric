[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-rubric"
version = "1.2.1"
description = "Evidence-first assessment for agent outputs and applications, with cited scoring and coverage-aware feedback."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Rolando Bosch", email = "roli@hermes-labs.ai" }]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]
keywords = ["llm", "evaluation", "rubric", "scoring", "ai-audit", "evidence", "hermes-labs"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]
# SDK-based backends are optional; users install the provider they want.
openai = ["openai>=1.50"]
google = ["google-generativeai>=0.8"]
inspect = ["inspect-ai>=0.3.245"]
# Source: https://openai.github.io/openai-agents-python/ (SDK compatibility; >=0.22)
openai-agents = ["openai-agents>=0.22"]

[project.scripts]
hermes-rubric = "hermes_rubric.cli:main"

[project.entry-points.inspect_ai]
hermes_rubric = "hermes_rubric.integrations.inspect_ai"

[project.urls]
Homepage = "https://hermes-labs.ai/hermes-rubric"
Documentation = "https://github.com/hermes-labs-ai/hermes-rubric/tree/main/docs"
Repository = "https://github.com/hermes-labs-ai/hermes-rubric"
Issues = "https://github.com/hermes-labs-ai/hermes-rubric/issues"
Changelog = "https://github.com/hermes-labs-ai/hermes-rubric/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_rubric"]
include = ["src/hermes_rubric/classes/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
