site_name: hermes-rubric
site_description: Framework-neutral, evidence-first assessment for agent outputs and applications.
site_url: https://hermes-labs-ai.github.io/hermes-rubric
repo_url: https://github.com/hermes-labs-ai/hermes-rubric
repo_name: hermes-labs-ai/hermes-rubric

theme:
  name: material
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Install: install.md
  - Quickstart: quickstart.md
  - Python API: API.md
  - CLI: CLI.md
  - Backends: BACKENDS.md
  - Architecture: ARCHITECTURE.md
  - Adapter contract: ADAPTERS.md
  - Benchmarks: BENCHMARKS.md
  - Philosophy: PHILOSOPHY.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
