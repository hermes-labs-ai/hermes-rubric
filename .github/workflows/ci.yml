name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[inspect,openai-agents]"
          pip install pytest pytest-mock

      - name: Run tests
        run: PYTHONPATH=src python3 -m pytest tests/ -v

      - name: Verify no API key required
        run: |
          # Tests must pass without any API keys set
          unset ANTHROPIC_API_KEY OPENAI_API_KEY DASHSCOPE_API_KEY
          PYTHONPATH=src python3 -m pytest tests/ -v

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build exact artifacts
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Smoke-test the wheel in a clean environment
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          python -m venv "$tmp/wheel-venv"
          "$tmp/wheel-venv/bin/python" -m pip install dist/*.whl
          "$tmp/wheel-venv/bin/hermes-rubric" --help

      - name: Test the exact source distribution
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          tar -xzf dist/hermes_rubric-*.tar.gz -C "$tmp"
          cd "$tmp"/hermes_rubric-*
          python -m pip install ".[inspect,openai-agents]" pytest pytest-mock
          python -m pytest tests/ -v --override-ini pythonpath=
