name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[inspect,openai-agents]"
          pip install pytest pytest-mock

      - name: Run tests
        run: PYTHONPATH=src python3 -m pytest tests/ -v

      - name: Verify no API key required
        run: |
          # Tests must pass without any API keys set
          unset ANTHROPIC_API_KEY OPENAI_API_KEY DASHSCOPE_API_KEY
          PYTHONPATH=src python3 -m pytest tests/ -v

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build exact artifacts
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Smoke-test the wheel in a clean environment
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          python -m venv "$tmp/wheel-venv"
          "$tmp/wheel-venv/bin/python" -m pip install dist/*.whl
          "$tmp/wheel-venv/bin/hermes-rubric" --help

      - name: Test the exact source distribution
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          tar -xzf dist/hermes_rubric-*.tar.gz -C "$tmp"
          cd "$tmp"/hermes_rubric-*
          python -m pip install ".[inspect,openai-agents]" pytest pytest-mock
          python -m pytest tests/ -v --override-ini pythonpath=

  manifest-csv-integrity:
    name: Manifest CSV integrity only
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: State check scope
        shell: bash
        run: |
          {
            echo "## Manifest CSV integrity only"
            echo
            echo "Checks the committed manifest's CSV structure and required fields."
            echo "It does not validate experiment conclusions."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Require exact ordered manifest header
        run: >-
          python3 scripts/check_manifest_header.py
          experiments/batch-equiv-2026-04-25/RUNS-MANIFEST.csv
          .github/csv-quality-gate-manifest.toml
          batch_runs_manifest

      - name: Check committed batch-run manifest
        uses: hermes-labs-ai/csv-quality-gate@e70192a24da6c293dd72e17169c17b844fb84bbf
        with:
          csv-path: experiments/batch-equiv-2026-04-25/RUNS-MANIFEST.csv
          profile: batch_runs_manifest
          config: .github/csv-quality-gate-manifest.toml
          summary: true
