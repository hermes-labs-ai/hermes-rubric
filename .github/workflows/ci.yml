name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python3 -m pip install -e '.[dev,inspect,openai-agents]' pytest-mock

      - name: Run native test contract without provider keys
        run: bash scripts/local-ci.sh

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package-check tools
        run: python3 -m pip install --upgrade pip build twine

      - name: Check exact wheel and source distribution in clean environments
        run: bash .hermes/check-package.sh

  manifest-csv-integrity:
    name: Manifest CSV integrity only
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: State check scope
        shell: bash
        run: |
          {
            echo "## Manifest CSV integrity only"
            echo
            echo "Checks the committed manifest's CSV structure and required fields."
            echo "It does not validate experiment conclusions."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Require exact ordered manifest header
        run: >-
          python3 scripts/check_manifest_header.py
          experiments/batch-equiv-2026-04-25/RUNS-MANIFEST.csv
          .github/csv-quality-gate-manifest.toml
          batch_runs_manifest

      - name: Check committed batch-run manifest
        uses: hermes-labs-ai/csv-quality-gate@24ed1cbe45f6d2b1c2b9a154e147fbb32f393e1d
        with:
          csv-path: experiments/batch-equiv-2026-04-25/RUNS-MANIFEST.csv
          profile: batch_runs_manifest
          config: .github/csv-quality-gate-manifest.toml
          summary: true
