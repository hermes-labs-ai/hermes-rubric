name: Hermes quality rail

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install project and declared gate tools
        run: python3 -m pip install -e '.[dev,inspect,openai-agents]' pytest-mock build twine
      - name: Run declared full gate
        run: python3 .hermes/hermes_gate_runner.py full
